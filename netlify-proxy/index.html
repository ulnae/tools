<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 反代状态检测</title>
<style>
    body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
           max-width: 560px; margin: 0 auto; padding: 24px 16px; color: #1f2328; background: #f6f8fa; }
    h1 { font-size: 20px; } p { font-size: 14px; color: #57606a; line-height: 1.6; }
    button { padding: 10px 18px; margin: 6px 8px 18px 0; font-size: 15px; border: 1px solid #d0d7de;
             border-radius: 8px; background: #fff; cursor: pointer; }
    button:active { background: #eaeef2; }
    #out { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 14px;
           font-family: Consolas, monospace; font-size: 13px; white-space: pre-wrap;
           word-break: break-all; min-height: 60px; }
    .ok { color: #1a7f37; } .bad { color: #cf222e; }
</style>
</head>
<body>
<h1>Netlify 反代状态</h1>
<p>本页用于验证完整链路：<b>浏览器 → 此域名 → Cloudflare Worker → D1</b>。
请在<b>手机 4G（关 WiFi）</b>下打开本页测试——那才是访客的真实网络环境。</p>

<button onclick="testHealth()">测试 /api/health</button>
<button onclick="testTrack()">测试 /api/track（写一条测试数据）</button>
<div id="out">点击按钮开始…</div>

<script>
    var out = document.getElementById('out');
    function line(s, cls) { out.innerHTML += (cls ? '<span class="' + cls + '">' : '') + s + (cls ? '</span>' : '') + '\n'; }

    async function testHealth() {
        out.innerHTML = '';
        var t0 = performance.now();
        try {
            var r = await fetch('/api/health', { cache: 'no-store' });
            var j = await r.json();
            var ms = Math.round(performance.now() - t0);
            line('HTTP ' + r.status + '  耗时 ' + ms + 'ms', ms < 1500 ? 'ok' : 'bad');
            line('响应: ' + JSON.stringify(j));
            line(j.ok ? '✔ 链路通畅' : '✘ Worker 返回异常', j.ok ? 'ok' : 'bad');
        } catch (e) {
            line('✘ 失败: ' + (e && e.message), 'bad');
            line('（若在 4G 下失败，说明此域名/Netlify 也不可达，需换方案）');
        }
    }

    async function testTrack() {
        out.innerHTML = '';
        var t0 = performance.now();
        try {
            var r = await fetch('/api/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fp: 'netlify-proxy-test-' + Math.random().toString(36).slice(2, 10),
                    page: 'netlify-proxy-test', conf: 0.5,
                    ua: navigator.userAgent, lang: navigator.language, tz: ''
                })
            });
            var j = await r.json();
            var ms = Math.round(performance.now() - t0);
            line('HTTP ' + r.status + '  耗时 ' + ms + 'ms', r.ok ? 'ok' : 'bad');
            line('响应: ' + JSON.stringify(j));
            line(r.ok ? '✔ 上报成功（CORS 预检也通过了）——测试数据可在 manage/stats.html 删除'
                      : '✘ 上报失败', r.ok ? 'ok' : 'bad');
        } catch (e) {
            line('✘ 失败: ' + (e && e.message), 'bad');
            line('（health 通但 track 失败 → 多半是 CORS 预检被 Netlify 拦了，需升级为 Edge Function）');
        }
    }
</script>
</body>
</html>
