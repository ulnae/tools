<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>每日提醒</title>

<!-- 图标：蓝紫渐变圆角底 + 白色时钟（描边圆环 + 双针 + 中心点） -->
<link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235eb4ff'/%3E%3Cstop offset='1' stop-color='%230050d2'/%3E%3C/linearGradient%3E%3ClinearGradient id='b' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23fff' stop-opacity='.34'/%3E%3Cstop offset='.58' stop-color='%23fff' stop-opacity='0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='23' fill='url(%23a)'/%3E%3Crect width='100' height='100' rx='23' fill='url(%23b)'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round'%3E%3Ccircle cx='50' cy='52' r='24.5'/%3E%3Cpath d='M50 36.5V52'/%3E%3Cpath d='M50 52l10.5 6.5'/%3E%3C/g%3E%3Ccircle cx='50' cy='52' r='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235eb4ff'/%3E%3Cstop offset='1' stop-color='%230050d2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23a)'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round'%3E%3Ccircle cx='50' cy='52' r='24.5'/%3E%3Cpath d='M50 36.5V52'/%3E%3Cpath d='M50 52l10.5 6.5'/%3E%3C/g%3E%3Ccircle cx='50' cy='52' r='4' fill='%23fff'/%3E%3C/svg%3E">

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    darkMode: 'media',
    theme: {
      extend: {
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"PingFang SC"',
                 '"Helvetica Neue"', '"Microsoft YaHei"', 'system-ui', 'sans-serif']
        }
      }
    }
  };
</script>

<style>
  html { -webkit-text-size-adjust: 100%; }
  body { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  input { font-variant-numeric: tabular-nums; }
  @keyframes itemIn { from { opacity: 0; transform: translateY(-6px); } }
  .animate-item { animation: itemIn .28s cubic-bezier(.22, 1, .36, 1); }
</style>
</head>

<body class="min-h-screen bg-[#f2f2f7] font-sans text-black transition-colors duration-300
             dark:bg-black dark:text-white">

<div id="app" class="mx-auto w-full max-w-lg px-4 pt-[max(2rem,env(safe-area-inset-top))] pb-24">

  <!-- 头部 -->
  <header class="px-1">
    <h1 class="text-[32px] leading-tight font-bold tracking-tight">每日提醒</h1>
    <p class="mt-1.5 text-[13px] leading-relaxed text-[#8e8e93] dark:text-[#98989d]">
      设定一个时刻，每天到点准时提醒你
    </p>
  </header>

  <!-- 设置卡片 -->
  <section class="mt-6 rounded-[18px] bg-white shadow-sm transition-colors duration-300 dark:bg-[#1c1c1e]">

    <div class="px-4 py-4">
      <label for="titleInput" class="block text-[13px] font-medium text-[#8e8e93] dark:text-[#98989d]">
        提醒内容
      </label>
      <input id="titleInput" v-model="title" type="text" maxlength="50" autocomplete="off"
             enterkeyhint="done" placeholder="例如：喝水、起身活动、开会"
             @keydown.enter="add"
             class="mt-2 w-full border-0 bg-transparent p-0 text-[17px] leading-snug text-black
                    outline-none placeholder:text-[#c7c7cc] dark:text-white dark:placeholder:text-[#48484a]">
    </div>

    <div class="mx-4 h-px bg-black/[0.08] dark:bg-white/[0.12]"></div>

    <div class="px-4 py-4">
      <div class="flex items-baseline justify-between">
        <span class="text-[13px] font-medium text-[#8e8e93] dark:text-[#98989d]">提醒时间</span>
        <span class="text-[12px] text-[#c7c7cc] dark:text-[#48484a]">每天重复</span>
      </div>

      <div class="mt-2 flex items-start gap-2">
        <div class="flex-1">
          <input ref="hhEl" type="text" inputmode="numeric" maxlength="2" value="00" aria-label="时"
                 @focus="$event.target.select()"
                 @input="onInput($event, mmEl)"
                 @blur="normalize($event, 23)"
                 class="h-[58px] w-full rounded-[14px] border-0 bg-[#f2f2f7] text-center text-[30px]
                        font-medium text-black outline-none transition focus:ring-2 focus:ring-[#007aff]
                        dark:bg-[#2c2c2e] dark:text-white dark:focus:ring-[#0a84ff]">
          <span class="mt-1.5 block text-center text-[11px] text-[#8e8e93] dark:text-[#98989d]">时</span>
        </div>

        <div class="h-[58px] leading-[58px] text-[26px] font-medium text-[#c7c7cc] select-none
                    dark:text-[#48484a]">:</div>

        <div class="flex-1">
          <input ref="mmEl" type="text" inputmode="numeric" maxlength="2" value="00" aria-label="分"
                 @focus="$event.target.select()"
                 @input="onInput($event, ssEl)"
                 @blur="normalize($event, 59)"
                 class="h-[58px] w-full rounded-[14px] border-0 bg-[#f2f2f7] text-center text-[30px]
                        font-medium text-black outline-none transition focus:ring-2 focus:ring-[#007aff]
                        dark:bg-[#2c2c2e] dark:text-white dark:focus:ring-[#0a84ff]">
          <span class="mt-1.5 block text-center text-[11px] text-[#8e8e93] dark:text-[#98989d]">分</span>
        </div>

        <div class="h-[58px] leading-[58px] text-[26px] font-medium text-[#c7c7cc] select-none
                    dark:text-[#48484a]">:</div>

        <div class="flex-1">
          <input ref="ssEl" type="text" inputmode="numeric" maxlength="2" value="00" aria-label="秒"
                 @focus="$event.target.select()"
                 @input="onInput($event, null)"
                 @blur="normalize($event, 59)"
                 class="h-[58px] w-full rounded-[14px] border-0 bg-[#f2f2f7] text-center text-[30px]
                        font-medium text-black outline-none transition focus:ring-2 focus:ring-[#007aff]
                        dark:bg-[#2c2c2e] dark:text-white dark:focus:ring-[#0a84ff]">
          <span class="mt-1.5 block text-center text-[11px] text-[#8e8e93] dark:text-[#98989d]">秒</span>
        </div>
      </div>
    </div>

    <div class="mx-4 h-px bg-black/[0.08] dark:bg-white/[0.12]"></div>

    <div class="px-4 py-4">
      <span class="block text-[13px] font-medium text-[#8e8e93] dark:text-[#98989d]">快捷设置</span>
      <div class="mt-2 flex gap-2 overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
        <button v-for="q in quicks" :key="q.v" type="button" @click="quick(q.v)"
                class="shrink-0 rounded-full bg-[#f2f2f7] px-4 py-2 text-[14px] font-medium text-[#007aff]
                       transition active:scale-95 dark:bg-[#2c2c2e] dark:text-[#0a84ff]">
          {{ q.label }}
        </button>
      </div>
    </div>
  </section>

  <!-- 添加按钮 -->
  <button type="button" @click="add"
          class="mt-4 w-full rounded-[15px] bg-[#007aff] py-4 text-[17px] font-semibold text-white
                 shadow-lg shadow-[#007aff]/25 transition active:scale-[0.975] active:opacity-90
                 dark:bg-[#0a84ff] dark:shadow-[#0a84ff]/20">
    添加提醒
  </button>

  <!-- 列表 -->
  <section class="mt-8">
    <div class="flex items-baseline justify-between px-2 pb-2.5">
      <h2 class="text-[17px] font-semibold tracking-tight">提醒列表</h2>
      <span v-if="reminders.length"
            class="text-[13px] tabular-nums text-[#8e8e93] dark:text-[#98989d]">
        {{ reminders.length }} 条
      </span>
    </div>

    <ul class="overflow-hidden rounded-[18px] bg-white shadow-sm transition-colors duration-300
               dark:bg-[#1c1c1e]">

      <li v-if="!reminders.length"
          class="px-6 py-12 text-center text-[15px] leading-relaxed text-[#8e8e93] dark:text-[#98989d]">
        还没有提醒
        <small class="mt-1 block text-[13px] text-[#c7c7cc] dark:text-[#48484a]">
          添加一个时间点，让每一天都井井有条
        </small>
      </li>

      <li v-for="r in reminders" :key="r.id"
          class="animate-item flex items-center gap-3 border-b border-black/[0.08] px-4 py-3.5
                 last:border-b-0 dark:border-white/[0.12]">
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <span class="min-w-0 truncate text-[16px] font-medium leading-snug">{{ r.title }}</span>
            <span v-if="firedToday(r)"
                  class="shrink-0 rounded-full bg-[#34c759]/10 px-1.5 py-px text-[11px] font-medium
                         text-[#248a3d] dark:bg-[#30d158]/15 dark:text-[#30d158]">
              已提醒
            </span>
          </div>
          <div class="mt-1 flex items-center gap-1.5 text-[13px] text-[#8e8e93] dark:text-[#98989d]">
            <span class="tabular-nums">{{ firedToday(r) ? '明天' : '每天' }} {{ fmt(r) }}</span>
            <span class="text-[#c7c7cc] dark:text-[#48484a]">·</span>
            <span class="tabular-nums">{{ countdown(r) }}</span>
          </div>
        </div>

        <button type="button" @click="remove(r.id)" aria-label="删除"
                class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-[#f2f2f7] text-[#8e8e93]
                       transition active:scale-90 hover:text-[#ff3b30] dark:bg-[#2c2c2e]
                       dark:text-[#98989d] dark:hover:text-[#ff453a]">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round">
            <path d="M3.2 3.2l7.6 7.6M10.8 3.2l-7.6 7.6"/>
          </svg>
        </button>
      </li>
    </ul>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script>
(function () {
  'use strict';

  var Vue = window.Vue;
  var ref = Vue.ref, onMounted = Vue.onMounted;

  var KEY = 'daily_reminders_v1';
  var ICON = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='a' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235eb4ff'/%3E%3Cstop offset='1' stop-color='%230050d2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='23' fill='url(%23a)'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round'%3E%3Ccircle cx='50' cy='52' r='24.5'/%3E%3Cpath d='M50 36.5V52'/%3E%3Cpath d='M50 52l10.5 6.5'/%3E%3C/g%3E%3Ccircle cx='50' cy='52' r='4' fill='%23fff'/%3E%3C/svg%3E";

  var pad = function (n) { return n < 10 ? '0' + n : String(n); };
  var toNum = function (v, max) {
    var n = parseInt(v, 10);
    if (isNaN(n) || n < 0) n = 0;
    return Math.min(n, max);
  };
  var dayKey = function (d) {
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  };

  Vue.createApp({
    setup: function () {

      var title = ref('');
      var hhEl = ref(null), mmEl = ref(null), ssEl = ref(null);
      var reminders = ref([]);
      var now = ref(Date.now());
      var quicks = [
        { v: 5,  label: '5 分钟后'  },
        { v: 15, label: '15 分钟后' },
        { v: 30, label: '30 分钟后' },
        { v: 60, label: '1 小时后'  }
      ];

      /* ---------------- 存储 ---------------- */
      function save() {
        try { localStorage.setItem(KEY, JSON.stringify(reminders.value)); } catch (e) {}
      }
      function sortList() {
        reminders.value.sort(function (a, b) {
          return (a.hh * 3600 + a.mm * 60 + a.ss) - (b.hh * 3600 + b.mm * 60 + b.ss);
        });
      }
      function load() {
        var arr = [];
        try { arr = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { arr = []; }
        if (!Array.isArray(arr)) arr = [];
        reminders.value = arr.filter(function (r) {
          return r && r.id && typeof r.hh === 'number';
        });
        sortList();
      }

      /* ---------------- 音频（Web Audio 合成，无需文件） ---------------- */
      var ctx = null;
      function unlockAudio() {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!ctx) ctx = new AC();
        if (ctx.state === 'suspended') ctx.resume();
      }
      function beep() {
        unlockAudio();
        if (!ctx) return;
        for (var i = 0; i < 3; i++) {
          var t = ctx.currentTime + i * 0.42;
          var o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(920, t);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
          o.connect(g); g.connect(ctx.destination);
          o.start(t); o.stop(t + 0.38);
        }
      }

      /* ---------------- 通知（静默申请，无任何 UI） ---------------- */
      function askNotify() {
        try {
          if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
          }
        } catch (e) {}
      }

      function fire(r) {
        beep();
        try {
          if ('Notification' in window && Notification.permission === 'granted') {
            var n = new Notification(r.title, {
              body: pad(r.hh) + ':' + pad(r.mm) + ':' + pad(r.ss),
              icon: ICON,
              badge: ICON,
              tag: 'reminder-' + r.id,
              requireInteraction: true
            });
            n.onclick = function () { window.focus(); n.close(); };
          }
        } catch (e) {}
      }

      /* ---------------- 每秒检查（每日循环） ---------------- */
      function tick(grace) {
        now.value = Date.now();

        var d = new Date();
        var today = dayKey(d);
        var cur = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
        var win = (grace === undefined) ? 120 : grace;   // 触发容错窗口（秒）
        var changed = false;

        reminders.value.forEach(function (r) {
          var target = r.hh * 3600 + r.mm * 60 + r.ss;
          // 今天还没触发过，且已到点（且在容错窗口内）→ 触发
          if (r.lastFired !== today && cur >= target && cur - target < win) {
            r.lastFired = today;   // 标记今天已完成，明天自然再次触发
            changed = true;
            fire(r);
          }
        });

        if (changed) save();
      }

      /* ---------------- 渲染辅助 ---------------- */
      function fmt(r) {
        return pad(r.hh) + ':' + pad(r.mm) + ':' + pad(r.ss);
      }

      function firedToday(r) {
        return r.lastFired === dayKey(new Date(now.value));
      }

      function countdown(r) {
        var d = new Date(now.value);
        d.setHours(r.hh, r.mm, r.ss, 0);
        var diff = d.getTime() - now.value;
        if (diff < 0) diff += 86400000;          // 今天已过点 → 算到明天

        var t = Math.ceil(diff / 1000);
        if (t <= 5) return '马上提醒';
        if (t < 60) return t + ' 秒后提醒';

        if (t < 3600) {
          var m = Math.floor(t / 60), s = t % 60;
          return s ? (m + ' 分 ' + s + ' 秒后提醒') : (m + ' 分钟后提醒');
        }

        var h = Math.floor(t / 3600), mm = Math.floor((t % 3600) / 60);
        return mm ? (h + ' 小时 ' + mm + ' 分后提醒') : (h + ' 小时后提醒');
      }

      /* ---------------- 输入处理 ---------------- */
      function onInput(e, next) {
        var v = e.target.value.replace(/\D/g, '').slice(0, 2);
        if (e.target.value !== v) e.target.value = v;
        if (v.length === 2 && next) next.focus();
      }

      function normalize(e, max) {
        e.target.value = pad(toNum(e.target.value, max));
      }

      function setTime(h, m, s) {
        if (hhEl.value) hhEl.value.value = pad(h);
        if (mmEl.value) mmEl.value.value = pad(m);
        if (ssEl.value) ssEl.value.value = pad(s);
      }

      function quick(min) {
        var d = new Date(Date.now() + min * 60000);
        setTime(d.getHours(), d.getMinutes(), d.getSeconds());
      }

      /* ---------------- 添加 / 删除 ---------------- */
      function add() {
        unlockAudio();
        askNotify();

        var h = toNum(hhEl.value && hhEl.value.value, 23);
        var m = toNum(mmEl.value && mmEl.value.value, 59);
        var s = toNum(ssEl.value && ssEl.value.value, 59);
        setTime(h, m, s);

        var d = new Date();
        var today = dayKey(d);
        var passed = (d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds()) >
                     (h * 3600 + m * 60 + s);

        reminders.value.push({
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          title: title.value.trim() || '时间到啦',
          hh: h, mm: m, ss: s,
          lastFired: passed ? today : null   // 今天已过点 → 今天不再触发
        });

        sortList();
        save();

        title.value = '';
        quick(5);
      }

      function remove(id) {
        reminders.value = reminders.value.filter(function (r) { return r.id !== id; });
        save();
      }

      /* ---------------- 后台保活 ---------------- */
      onMounted(function () {
        load();
        now.value = Date.now();
        quick(5);

        // 保活 1：内联 Worker 计时（后台标签页不会被节流到 1 分钟）
        try {
          var src = 'let i=0;onmessage=()=>{clearInterval(i);i=setInterval(()=>postMessage(0),1000)};';
          var w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
          w.onmessage = function () { tick(); };
        } catch (e) { /* 不支持时由下方 setInterval 兜底 */ }

        // 保活 2：主线程兜底定时器
        setInterval(function () { tick(); }, 1000);

        // 保活 3：屏幕唤醒锁，避免息屏后页面被冻结
        var lock = function () {
          try {
            if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(function () {});
          } catch (e) {}
        };
        lock();

        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) { lock(); tick(300); }
        });
        window.addEventListener('focus', function () { tick(300); });
      });

      return {
        title: title,
        hhEl: hhEl, mmEl: mmEl, ssEl: ssEl,
        reminders: reminders,
        quicks: quicks,
        add: add, remove: remove, quick: quick,
        onInput: onInput, normalize: normalize,
        fmt: fmt, countdown: countdown, firedToday: firedToday
      };
    }
  }).mount('#app');

})();
</script>
</body>
</html>
