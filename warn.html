<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>定时提醒</title>

<!-- 页面图标（内联 SVG，无需外部文件） -->
<link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B0%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23007aff'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle'%3E%E2%8F%B0%3C/text%3E%3C/svg%3E">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'media',           // 跟随系统深浅色
    theme: {
      extend: {
        fontFamily: {
          sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"PingFang SC"',
                 '"Helvetica Neue"', '"Microsoft YaHei"', 'system-ui', 'sans-serif']
        }
      }
    }
  };
</script>

<style>
  html { -webkit-text-size-adjust: 100%; }
  body { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  input[type="text"] { font-variant-numeric: tabular-nums; }
  @keyframes itemIn { from { opacity: 0; transform: translateY(-6px); } }
  .animate-item { animation: itemIn .28s cubic-bezier(.22, 1, .36, 1); }
</style>
</head>

<body class="min-h-screen bg-[#f2f2f7] text-black font-sans transition-colors duration-300
             dark:bg-black dark:text-white">

  <main class="mx-auto w-full max-w-lg px-4 pt-8 pb-24
               pt-[max(2rem,env(safe-area-inset-top))]">

    <!-- 头部 -->
    <header class="px-1">
      <h1 class="text-[32px] leading-tight font-bold tracking-tight">定时提醒</h1>
      <p class="mt-1 text-[13px] leading-relaxed text-[#8e8e93] dark:text-[#98989d]">
        设置时分秒，到点通过系统通知提醒你
      </p>
    </header>

    <!-- 通知权限提示（仅此一处 UI，提醒本身走系统通知） -->
    <div id="hint" hidden
         class="mt-4 flex items-center gap-3 rounded-2xl bg-[#007aff]/10 px-4 py-3
                text-[13px] leading-relaxed text-[#007aff] dark:bg-[#0a84ff]/[0.18] dark:text-[#0a84ff]">
      <span id="hintText" class="flex-1"></span>
      <button id="hintBtn" type="button" hidden
              class="shrink-0 rounded-full bg-[#007aff] px-4 py-1.5 text-[13px] font-semibold text-white
                     active:opacity-80 dark:bg-[#0a84ff]">
        开启
      </button>
    </div>

    <!-- 设置卡片 -->
    <section class="mt-6 rounded-[18px] bg-white shadow-sm transition-colors duration-300
                    dark:bg-[#1c1c1e]">

      <!-- 标题 -->
      <div class="px-4 py-4">
        <label for="titleInput"
               class="block text-[13px] font-medium text-[#8e8e93] dark:text-[#98989d]">
          提醒标题
        </label>
        <input id="titleInput" type="text" maxlength="50" autocomplete="off"
               enterkeyhint="done" placeholder="例如：开会 / 喝水 / 休息一下"
               class="mt-2 w-full border-0 bg-transparent p-0 text-[17px] leading-snug
                      text-black outline-none placeholder:text-[#c7c7cc]
                      dark:text-white dark:placeholder:text-[#48484a]">
      </div>

      <div class="mx-4 h-px bg-black/[0.08] dark:bg-white/[0.12]"></div>

      <!-- 时间 -->
      <div class="px-4 py-4">
        <span class="block text-[13px] font-medium text-[#8e8e93] dark:text-[#98989d]">
          提醒时间
        </span>

        <div class="mt-2 flex items-start gap-2">
          <div class="flex-1">
            <input id="hh" type="text" inputmode="numeric" maxlength="2" value="00"
                   aria-label="时"
                   class="h-[58px] w-full rounded-[14px] border-0 bg-[#f2f2f7] text-center
                          text-[30px] font-medium outline-none transition
                          focus:ring-2 focus:ring-[#007aff]
                          dark:bg-[#2c2c2e] dark:focus:ring-[#0a84ff]">
            <span class="mt-1.5 block text-center text-[11px] text-[#8e8e93] dark:text-[#98989d]">时</span>
          </div>

          <div class="h-[58px] leading-[58px] text-[26px] font-medium text-[#c7c7cc]
                      select-none dark:text-[#48484a]">:</div>

          <div class="flex-1">
            <input id="mm" type="text" inputmode="numeric" maxlength="2" value="00"
                   aria-label="分"
                   class="h-[58px] w-full rounded-[14px] border-0 bg-[#f2f2f7] text-center
                          text-[30px] font-medium outline-none transition
                          focus:ring-2 focus:ring-[#007aff]
                          dark:bg-[#2c2c2e] dark:focus:ring-[#0a84ff]">
            <span class="mt-1.5 block text-center text-[11px] text-[#8e8e93] dark:text-[#98989d]">分</span>
          </div>

          <div class="h-[58px] leading-[58px] text-[26px] font-medium text-[#c7c7cc]
                      select-none dark:text-[#48484a]">:</div>

          <div class="flex-1">
            <input id="ss" type="text" inputmode="numeric" maxlength="2" value="00"
                   aria-label="秒"
                   class="h-[58px] w-full rounded-[14px] border-0 bg-[#f2f2f7] text-center
                          text-[30px] font-medium outline-none transition
                          focus:ring-2 focus:ring-[#007aff]
                          dark:bg-[#2c2c2e] dark:focus:ring-[#0a84ff]">
            <span class="mt-1.5 block text-center text-[11px] text-[#8e8e93] dark:text-[#98989d]">秒</span>
          </div>
        </div>

        <p class="mt-3 text-center text-[12px] text-[#8e8e93] dark:text-[#98989d]">
          若该时间今天已过，将自动顺延到明天
        </p>
      </div>

      <div class="mx-4 h-px bg-black/[0.08] dark:bg-white/[0.12]"></div>

      <!-- 快捷设置 -->
      <div class="px-4 py-4">
        <span class="block text-[13px] font-medium text-[#8e8e93] dark:text-[#98989d]">
          快捷设置
        </span>
        <div class="mt-2 flex gap-2 overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
          <button type="button" data-add-min="5"
                  class="shrink-0 rounded-full bg-[#f2f2f7] px-4 py-2 text-[14px] font-medium
                         text-[#007aff] transition active:scale-95 dark:bg-[#2c2c2e] dark:text-[#0a84ff]">
            +5 分
          </button>
          <button type="button" data-add-min="15"
                  class="shrink-0 rounded-full bg-[#f2f2f7] px-4 py-2 text-[14px] font-medium
                         text-[#007aff] transition active:scale-95 dark:bg-[#2c2c2e] dark:text-[#0a84ff]">
            +15 分
          </button>
          <button type="button" data-add-min="30"
                  class="shrink-0 rounded-full bg-[#f2f2f7] px-4 py-2 text-[14px] font-medium
                         text-[#007aff] transition active:scale-95 dark:bg-[#2c2c2e] dark:text-[#0a84ff]">
            +30 分
          </button>
          <button type="button" data-add-min="60"
                  class="shrink-0 rounded-full bg-[#f2f2f7] px-4 py-2 text-[14px] font-medium
                         text-[#007aff] transition active:scale-95 dark:bg-[#2c2c2e] dark:text-[#0a84ff]">
            +1 时
          </button>
        </div>
      </div>
    </section>

    <!-- 添加按钮 -->
    <button id="addBtn" type="button"
            class="mt-4 w-full rounded-[15px] bg-[#007aff] py-4 text-[17px] font-semibold text-white
                   shadow-lg shadow-[#007aff]/25 transition active:scale-[0.975] active:opacity-90
                   dark:bg-[#0a84ff] dark:shadow-[#0a84ff]/20">
      添加提醒
    </button>

    <!-- 列表 -->
    <section class="mt-8">
      <div class="flex items-baseline justify-between px-2 pb-2.5">
        <h2 class="text-[17px] font-semibold tracking-tight">提醒列表</h2>
        <button id="clearBtn" type="button" hidden
                class="text-[14px] text-[#007aff] active:opacity-55 dark:text-[#0a84ff]">
          清除已完成
        </button>
      </div>

      <ul id="list"
          class="overflow-hidden rounded-[18px] bg-white shadow-sm transition-colors duration-300
                 dark:bg-[#1c1c1e] empty:bg-transparent empty:shadow-none"></ul>
    </section>

  </main>

<script>
(function () {
  'use strict';

  var KEY = 'reminder_list_v3';
  var ICON = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23007aff'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle'%3E%E2%8F%B0%3C/text%3E%3C/svg%3E";

  var $ = function (s) { return document.querySelector(s); };

  var titleInput = $('#titleInput');
  var hhEl = $('#hh'), mmEl = $('#mm'), ssEl = $('#ss');
  var listEl = $('#list');
  var hintEl = $('#hint');
  var hintText = $('#hintText');
  var hintBtn = $('#hintBtn');
  var clearBtn = $('#clearBtn');

  var reminders = [];
  var metaEls = {};
  var audioCtx = null;

  /* ---------------- 工具 ---------------- */
  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function timeStr(ts) {
    var d = new Date(ts);
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function dayLabel(ts) {
    var d = new Date(ts), n = new Date();
    var t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
    var d0 = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    var diff = Math.round((d0 - t0) / 86400000);
    if (diff === 0) return '今天';
    if (diff === 1) return '明天';
    if (diff === 2) return '后天';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function countdown(ms) {
    if (ms <= 0) return '即将提醒';
    var t = Math.floor(ms / 1000);
    var d = Math.floor(t / 86400);
    var h = Math.floor((t % 86400) / 3600);
    var m = Math.floor((t % 3600) / 60);
    var s = t % 60;
    if (d > 0) return '还有 ' + d + ' 天 ' + h + ' 小时';
    if (h > 0) return '还有 ' + h + ' 小时 ' + m + ' 分';
    if (m > 0) return '还有 ' + m + ' 分 ' + s + ' 秒';
    return '还有 ' + s + ' 秒';
  }

  function metaText(r, now) {
    var base = dayLabel(r.time) + ' ' + timeStr(r.time);
    if (r.missed)   return base + ' · 已错过';
    if (r.notified) return base + ' · 已提醒';
    return base + ' · ' + countdown(r.time - now);
  }

  /* ---------------- 存储 ---------------- */
  function load() {
    var list = [];
    try { list = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { list = []; }
    if (!Array.isArray(list)) list = [];

    var now = Date.now();
    list = list.filter(function (r) {
      return r && r.id && typeof r.time === 'number';
    });

    list.forEach(function (r) {
      r.notified = !!r.notified;
      r.missed = !!r.missed;
      // 页面关闭期间错过 30 秒以上的，标记为已错过，不再补弹
      if (!r.notified && r.time < now - 30000) {
        r.notified = true;
        r.missed = true;
      }
    });

    return list.sort(function (a, b) { return a.time - b.time; });
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(reminders)); } catch (e) {}
  }

  /* ---------------- 通知权限 ---------------- */
  function updateHint() {
    if (!('Notification' in window)) {
      hintEl.hidden = false;
      hintBtn.hidden = true;
      hintText.textContent = '当前浏览器不支持系统通知，无法弹出提醒。';
      return;
    }
    if (Notification.permission === 'granted') {
      hintEl.hidden = true;
      return;
    }
    hintEl.hidden = false;
    if (Notification.permission === 'denied') {
      hintBtn.hidden = true;
      hintText.textContent = '通知权限已被拒绝，请在浏览器地址栏的站点设置里重新允许通知。';
      return;
    }
    hintBtn.hidden = false;
    hintText.textContent = '开启通知后，切换到其他标签页也能收到提醒';
  }

  function requestPermission() {
    if (!('Notification' in window)) { updateHint(); return; }
    if (Notification.permission !== 'default') { updateHint(); return; }
    try {
      var p = Notification.requestPermission(function () { updateHint(); });
      if (p && typeof p.then === 'function') p.then(updateHint).catch(function () {});
    } catch (e) { updateHint(); }
  }

  hintBtn.addEventListener('click', requestPermission);

  /* ---------------- 提示音（Web Audio 合成，无需音频文件） ---------------- */
  function ensureAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function beep(times) {
    ensureAudio();
    if (!audioCtx) return;
    times = times || 3;
    for (var i = 0; i < times; i++) {
      var t = audioCtx.currentTime + i * 0.42;
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(920, t);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.38);
    }
  }

  /* ---------------- 触发提醒：只用系统通知 ---------------- */
  function fire(r) {
    if ('Notification' in window && Notification.permission === 'granted') {
      try {
        var n = new Notification('⏰ ' + r.title, {
          body: '时间到了 · ' + timeStr(r.time),
          icon: ICON,
          badge: ICON,
          tag: 'reminder-' + r.id,
          requireInteraction: true
        });
        n.onclick = function () { window.focus(); n.close(); };
      } catch (e) {
        /* 部分移动端浏览器不支持直接 new Notification，忽略 */
      }
    }
    beep(3);
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    metaEls = {};

    if (!reminders.length) {
      listEl.innerHTML =
        '<li class="px-6 py-12 text-center text-[15px] leading-relaxed text-[#8e8e93] dark:text-[#98989d]">' +
          '还没有提醒' +
          '<small class="mt-1 block text-[13px] text-[#c7c7cc] dark:text-[#48484a]">' +
            '设置一个时间点，到点提醒你' +
          '</small>' +
        '</li>';
      clearBtn.hidden = true;
      return;
    }

    var now = Date.now();
    var html = '';

    reminders.forEach(function (r) {
      var state = r.missed ? 'missed' : (r.notified ? 'done' : '');
      var titleCls = state === 'done'
        ? 'line-through text-[#8e8e93] dark:text-[#98989d]'
        : (state === 'missed' ? 'text-[#8e8e93] dark:text-[#98989d]' : '');

      html +=
        '<li class="animate-item flex items-center gap-3 px-4 py-3.5 ' +
             'border-b border-black/[0.08] last:border-b-0 dark:border-white/[0.12]">' +
          '<div class="min-w-0 flex-1">' +
            '<div class="text-[16px] font-medium leading-snug break-words ' + titleCls + '">' +
              esc(r.title) +
            '</div>' +
            '<div class="mt-1 text-[13px] tabular-nums ' +
                 (state === 'done' ? 'text-[#34c759] dark:text-[#30d158]'
                                   : 'text-[#8e8e93] dark:text-[#98989d]') + '" ' +
                 'data-meta="' + r.id + '">' + metaText(r, now) + '</div>' +
          '</div>' +
          '<button type="button" data-del="' + r.id + '" aria-label="删除" ' +
                  'class="grid h-8 w-8 shrink-0 place-items-center rounded-full ' +
                         'bg-[#f2f2f7] text-[#8e8e93] transition active:scale-90 ' +
                         'hover:text-[#ff3b30] dark:bg-[#2c2c2e] dark:text-[#98989d] ' +
                         'dark:hover:text-[#ff453a]">' +
            '<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" ' +
                 'stroke-width="2" stroke-linecap="round">' +
              '<path d="M3.2 3.2l7.6 7.6M10.8 3.2l-7.6 7.6"/>' +
            '</svg>' +
          '</button>' +
        '</li>';
    });

    listEl.innerHTML = html;

    listEl.querySelectorAll('[data-meta]').forEach(function (el) {
      metaEls[el.getAttribute('data-meta')] = el;
    });

    clearBtn.hidden = !reminders.some(function (r) { return r.notified; });
  }

  function updateMeta() {
    var now = Date.now();
    for (var i = 0; i < reminders.length; i++) {
      var r = reminders[i];
      var el = metaEls[r.id];
      if (el) el.textContent = metaText(r, now);
    }
  }

  /* ---------------- 每秒检查 ---------------- */
  function tick() {
    var now = Date.now();
    var changed = false;

    for (var i = 0; i < reminders.length; i++) {
      var r = reminders[i];
      if (!r.notified && r.time <= now) {
        r.notified = true;
        changed = true;
        fire(r);
      }
    }

    if (changed) { save(); render(); }
    else { updateMeta(); }
  }

  /* ---------------- 时分秒输入 ---------------- */
  function clamp(el, max) {
    var v = parseInt(el.value, 10);
    if (isNaN(v) || v < 0) v = 0;
    if (v > max) v = max;
    el.value = pad(v);
  }

  function setQuickTime(minutes) {
    var d = new Date(Date.now() + minutes * 60000);
    hhEl.value = pad(d.getHours());
    mmEl.value = pad(d.getMinutes());
    ssEl.value = pad(d.getSeconds());
  }

  var fields = [
    { el: hhEl, max: 23 },
    { el: mmEl, max: 59 },
    { el: ssEl, max: 59 }
  ];

  fields.forEach(function (f, i) {
    var el = f.el;

    el.addEventListener('focus', function () { el.select(); });

    el.addEventListener('input', function () {
      el.value = el.value.replace(/\D/g, '').slice(0, 2);
      if (el.value.length >= 2 && fields[i + 1]) fields[i + 1].el.focus();
    });

    el.addEventListener('blur', function () { clamp(el, f.max); });

    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); addReminder(); }
      else if (e.key === 'ArrowRight' && fields[i + 1]) fields[i + 1].el.focus();
      else if (e.key === 'ArrowLeft' && fields[i - 1]) fields[i - 1].el.focus();
    });
  });

  /* 快捷按钮 */
  document.querySelectorAll('[data-add-min]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var min = parseInt(btn.getAttribute('data-add-min'), 10) || 5;
      setQuickTime(min);
      ensureAudio();
      requestPermission();
    });
  });

  /* ---------------- 添加提醒 ---------------- */
  function addReminder() {
    var title = titleInput.value.trim() || '提醒时间到';

    clamp(hhEl, 23);
    clamp(mmEl, 59);
    clamp(ssEl, 59);

    var hh = parseInt(hhEl.value, 10) || 0;
    var mm = parseInt(mmEl.value, 10) || 0;
    var ss = parseInt(ssEl.value, 10) || 0;

    var now = new Date();
    var target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, ss, 0);

    // 今天已过 → 顺延到明天
    if (target.getTime() <= now.getTime()) {
      target.setDate(target.getDate() + 1);
    }

    reminders.push({
      id: uid(),
      title: title,
      time: target.getTime(),
      notified: false,
      missed: false
    });
    reminders.sort(function (a, b) { return a.time - b.time; });

    save();
    render();

    // 用户手势内：初始化音频 + 申请通知权限
    ensureAudio();
    requestPermission();

    // 重置表单，便于连续添加
    titleInput.value = '';
    setQuickTime(5);
    titleInput.focus();
  }

  $('#addBtn').addEventListener('click', addReminder);

  titleInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); addReminder(); }
  });

  /* ---------------- 删除 / 清除 ---------------- */
  listEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-del]') : null;
    if (!btn) return;
    var id = btn.getAttribute('data-del');
    reminders = reminders.filter(function (r) { return r.id !== id; });
    save();
    render();
  });

  clearBtn.addEventListener('click', function () {
    reminders = reminders.filter(function (r) { return !r.notified; });
    save();
    render();
  });

  /* ---------------- 启动 ---------------- */
  reminders = load();
  save();
  render();
  updateHint();
  setQuickTime(5);

  setInterval(tick, 1000);

  // 从后台切回前台立即补检一次（后台标签页定时器可能被节流）
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) tick();
  });
  window.addEventListener('focus', tick);

})();
</script>
</body>
</html>
