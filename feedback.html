<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>意见反馈</title>
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23007AFF'/%3E%3Cpath d='M7 9a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3h-6l-5 4v-4H10a3 3 0 0 1-3-3z' fill='%23fff'/%3E%3C/svg%3E">
    <script src="./utils/tailwindcss.js"></script>
    <script src="./utils/dayjs.min.js"></script>
    <script src="./utils/vue.global.prod.js"></script>
    <script src="./utils/github.js"></script>
    <style>
        :root {
            color-scheme: light;

            --ios-blue: #007AFF;
            --ios-red: #FF3B30;
            --ios-green: #34C759;
            --ios-orange: #FF9500;
            --ios-gray: #8E8E93;

            --ios-bg: #F2F2F7;

            --c-text: #1c1c1e;
            --c-text-2: #8E8E93;
            --c-text-3: #AEAEB2;

            --c-card: rgba(255, 255, 255, .86);
            --c-card-border: rgba(0, 0, 0, .04);
            --c-shadow: 0 8px 32px rgba(0, 0, 0, .08);

            --c-input: rgba(120, 120, 128, .10);
            --c-seg-bg: rgba(120, 120, 128, .12);
            --c-seg-on: #ffffff;
            --c-seg-on-text: #1c1c1e;
            --c-seg-on-shadow: 0 1px 4px rgba(0, 0, 0, .12);

            --c-soft-btn: rgba(120, 120, 128, .14);
            --c-scroll: rgba(0, 0, 0, .18);
            --c-focus-ring: rgba(0, 122, 255, .18);
            --c-btn-shadow: 0 8px 24px rgba(0, 122, 255, .32);
            --c-green-soft: rgba(52, 199, 89, .12);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;

                --ios-blue: #0A84FF;
                --ios-red: #FF453A;
                --ios-green: #30D158;
                --ios-orange: #FF9F0A;
                --ios-gray: #98989D;

                --ios-bg: #000000;

                --c-text: #f2f2f7;
                --c-text-2: #98989D;
                --c-text-3: #636366;

                --c-card: rgba(28, 28, 30, .78);
                --c-card-border: rgba(255, 255, 255, .06);
                --c-shadow: 0 8px 32px rgba(0, 0, 0, .55);

                --c-input: rgba(120, 120, 128, .24);
                --c-seg-bg: rgba(120, 120, 128, .24);
                --c-seg-on: #636366;
                --c-seg-on-text: #ffffff;
                --c-seg-on-shadow: 0 1px 4px rgba(0, 0, 0, .4);

                --c-soft-btn: rgba(120, 120, 128, .24);
                --c-scroll: rgba(255, 255, 255, .2);
                --c-focus-ring: rgba(10, 132, 255, .30);
                --c-btn-shadow: 0 8px 24px rgba(10, 132, 255, .26);
                --c-green-soft: rgba(48, 209, 88, .16);
            }
        }

        html,
        body {
            height: 100%;
        }

        body.app-shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
                "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            background: var(--ios-bg);
            color: var(--c-text);
            transition: background-color .25s ease, color .25s ease;
        }

        #app {
            flex: 1 1 0%;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .glass {
            background: var(--c-card);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            box-shadow: var(--c-shadow), 0 0 0 .5px var(--c-card-border);
            transition: background-color .25s ease, box-shadow .25s ease;
        }

        .no-sb::-webkit-scrollbar {
            display: none;
        }

        .no-sb {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .scroll-area {
            overflow: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: var(--c-scroll) transparent;
        }

        .scroll-area::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }

        .scroll-area::-webkit-scrollbar-track {
            background: transparent;
        }

        .scroll-area::-webkit-scrollbar-thumb {
            background: var(--c-scroll);
            border-radius: 8px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        .ios-input {
            width: 100%;
            box-sizing: border-box;
            background: var(--c-input);
            border: none;
            border-radius: 12px;
            padding: 11px 14px;
            font-size: 14px;
            font-family: inherit;
            color: var(--c-text);
            outline: none;
            transition: box-shadow .18s, background-color .25s ease, color .25s ease;
        }

        .ios-input::placeholder {
            color: var(--c-text-3);
        }

        .ios-input:focus {
            box-shadow: 0 0 0 3px var(--c-focus-ring);
        }

        textarea.ios-input {
            resize: none;
            line-height: 1.55;
        }

        .f-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--c-text-2);
            margin: 16px 0 6px;
        }

        .f-label.first {
            margin-top: 0;
        }

        .seg-wrap {
            background: var(--c-seg-bg);
            transition: background-color .25s ease;
        }

        .seg-btn {
            flex: 1;
            padding: 9px 0;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            color: var(--c-text-2);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all .18s;
        }

        .seg-btn:active {
            transform: scale(.96);
        }

        .seg-btn.on {
            background: var(--c-seg-on);
            color: var(--c-seg-on-text);
            box-shadow: var(--c-seg-on-shadow);
        }

        .dot {
            width: .5rem;
            height: .5rem;
            border-radius: 9999px;
            flex: none;
        }

        .dot-ok {
            background: var(--ios-green);
        }

        .dot-err {
            background: var(--ios-red);
        }

        .dot-loading {
            background: var(--ios-orange);
            animation: pulse 2s cubic-bezier(.4, 0, .6, 1) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .45;
            }
        }

        @keyframes pop-in {
            from {
                transform: scale(.94) translateY(12px);
                opacity: 0;
            }

            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .anim-pop {
            animation: pop-in .3s cubic-bezier(.32, .72, 0, 1);
        }

        .btn-primary {
            background: var(--ios-blue);
            box-shadow: var(--c-btn-shadow);
            color: #fff;
            transition: transform .15s, box-shadow .25s ease, background-color .25s ease;
        }

        .btn-soft {
            background: var(--c-soft-btn);
            color: var(--ios-blue);
            transition: transform .15s, background-color .25s ease, color .25s ease;
        }

        .toast-item {
            transition: opacity .3s ease, transform .3s ease;
        }
    </style>
</head>

<body class="app-shell">
    <div id="app">

        <header class="glass flex-none z-30">
            <div class="max-w-[560px] mx-auto px-4 py-3 flex items-center gap-3">
                <h1 class="text-[16px] font-bold tracking-tight text-[var(--c-text)]">意见反馈</h1>
                <div class="ml-auto flex items-center gap-1.5">
                    <span :class="statusDotClass"></span>
                    <span class="text-[12px] whitespace-nowrap text-[var(--c-text-2)]">{{ statusText }}</span>
                </div>
            </div>
        </header>

        <main class="flex-1 min-h-0 overflow-y-auto scroll-area">
            <div class="max-w-[560px] mx-auto px-4 py-5 pb-12">

                <div v-if="!done" class="glass rounded-[22px] p-5 anim-pop">
                    <p class="text-[13px] leading-relaxed text-[var(--c-text-2)]">
                        你的每一条反馈都会被认真阅读，感谢你帮助我们变得更好。
                    </p>

                    <label class="f-label">反馈类型</label>
                    <div class="seg-wrap flex gap-1 p-1 rounded-2xl">
                        <button v-for="t in TYPES" :key="t" type="button" class="seg-btn"
                            :class="{ on: type === t }" @click="type = t">{{ t }}</button>
                    </div>

                    <label class="f-label">反馈内容 <span class="text-[var(--ios-red)]">*</span></label>
                    <textarea ref="contentEl" v-model="content" class="ios-input" rows="6" maxlength="500"
                        placeholder="请尽量描述清楚，比如：在哪个页面、做了什么操作、出现了什么情况..."></textarea>
                    <div class="text-right text-[11.5px] mt-1.5 text-[var(--c-text-3)]">
                        <span class="tabular-nums">{{ content.length }}</span> / 500
                    </div>

                    <label class="f-label">联系方式 <span
                            class="font-normal text-[var(--c-text-3)]">（选填）</span></label>
                    <input v-model="contact" class="ios-input" type="text" maxlength="50"
                        placeholder="邮箱 / 微信 / 手机号，便于我们回复你">

                    <p v-if="source" class="text-[11.5px] mt-3 text-center text-[var(--c-text-3)]">
                        来源：{{ source }}
                    </p>

                    <button :disabled="submitDisabled" @click="submitFeedback"
                        class="btn-primary mt-6 w-full py-3.5 rounded-2xl text-[16px] font-semibold active:scale-[.98] disabled:opacity-50">
                        {{ submitting ? '提交中...' : '提交反馈' }}
                    </button>

                    <p class="text-[11.5px] text-center mt-3.5 text-[var(--c-text-3)]">
                        提交即表示同意我们记录该内容用于产品改进
                    </p>
                </div>

                <div v-else class="glass rounded-[22px] p-8 flex flex-col items-center text-center anim-pop">
                    <div class="w-14 h-14 rounded-full flex items-center justify-center mb-4"
                        style="background:var(--c-green-soft)">
                        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                            stroke-linecap="round" stroke-linejoin="round" style="color:var(--ios-green)">
                            <path d="M20 6 9 17l-5-5" />
                        </svg>
                    </div>
                    <h2 class="text-[17px] font-bold text-[var(--c-text)]">提交成功</h2>
                    <p class="text-[13px] mt-1.5 leading-relaxed text-[var(--c-text-2)]">感谢你的反馈，我们会尽快处理。</p>
                    <button @click="showForm"
                        class="btn-soft mt-6 px-6 py-3 rounded-2xl text-[15px] font-semibold active:scale-[.98]">
                        再提一条
                    </button>
                </div>

            </div>
        </main>

        <div v-for="t in toasts" :key="t.id" class="toast-item fixed left-1/2 bottom-8 z-[9999] px-5 py-3
                   rounded-2xl text-white text-[13px] font-medium shadow-2xl -translate-x-1/2
                   max-w-[82vw] text-center pointer-events-none"
            :class="t.show ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-3'"
            :style="{ background: TOAST_BG[t.type] || TOAST_BG.info }">{{ t.msg }}</div>

    </div>

    <script>
        /* ============================================================
           通用工具
           ============================================================ */
        const now = () => dayjs().format('YYYY/MM/DD HH:mm');

        const MAX_SOURCE_LEN = 100;

        function getSourceFromUrl() {
            try {
                const v = new URLSearchParams(location.search).get('f');
                if (!v) return '';
                return v.trim().slice(0, MAX_SOURCE_LEN);
            } catch (e) {
                console.warn('解析来源参数失败：', e);
                return '';
            }
        }

        function normalizeFeedback(content) {
            if (content && Array.isArray(content)) return content;
            return [];
        }

        const TOAST_BG = {
            success: 'linear-gradient(135deg,#34C759,#28A745)',
            error: 'linear-gradient(135deg,#FF3B30,#D92D20)',
            info: 'linear-gradient(135deg,#007AFF,#0062CC)'
        };

        /* ============================================================
           Vue 应用
           ============================================================ */
        const { createApp, ref, reactive, computed, nextTick, onMounted, onBeforeUnmount } = Vue;

        createApp({
            setup() {
                const TYPES = ['建议', '问题', '其他'];

                const type = ref('建议');
                const content = ref('');
                const contact = ref('');
                const source = ref('');
                const done = ref(false);
                const submitting = ref(false);
                const ready = ref(false);
                const tokenFailed = ref(false);

                const statusState = ref('loading');
                const statusText = ref('初始化中...');

                const contentEl = ref(null);

                const toasts = ref([]);
                let toastSeq = 0;

                const statusDotClass = computed(() => `dot dot-${statusState.value}`);
                const submitDisabled = computed(() => submitting.value || tokenFailed.value);

                function setStatus(state, text) {
                    statusState.value = state;
                    statusText.value = text;
                }

                function toast(msg, t = 'info') {
                    const id = ++toastSeq;
                    const item = reactive({ id, msg, type: t, show: false });
                    toasts.value.push(item);

                    requestAnimationFrame(() => { item.show = true; });

                    setTimeout(() => {
                        item.show = false;
                        setTimeout(() => {
                            const i = toasts.value.indexOf(item);
                            if (i > -1) toasts.value.splice(i, 1);
                        }, 320);
                    }, 2200);
                }

                async function submitFeedback() {
                    if (submitting.value) return;

                    const text = content.value.trim();
                    const contactVal = contact.value.trim();

                    if (!ready.value) return toast('正在初始化，请稍候…', 'info');
                    if (!text) return toast('请填写反馈内容', 'error');
                    if (text.length < 5) return toast('内容太短了，请至少写 5 个字', 'error');

                    submitting.value = true;

                    const item = {
                        id: (crypto.randomUUID ? crypto.randomUUID()
                            : `${Date.now()}-${Math.random().toString(16).slice(2)}`),
                        type: type.value,
                        content: text,
                        contact: contactVal,
                        source: getSourceFromUrl(),
                        created_at: Date.now()
                    };

                    try {
                        await GitHub.updateFile(GitHub.CONFIG.FEEDBACK_FILE, (c) => {
                            const data = normalizeFeedback(c);
                            data.push(item);
                            return data;
                        }, `新增意见反馈（${item.type}） - ${now()}`);

                        content.value = '';
                        contact.value = '';

                        setStatus('ok', '已连接');
                        done.value = true;
                        toast('提交成功，感谢你的反馈！', 'success');
                    } catch (e) {
                        console.error(e);
                        setStatus('err', '提交失败');
                        toast(e.message || '提交失败，请稍后重试', 'error');
                    } finally {
                        submitting.value = false;
                    }
                }

                function showForm() {
                    done.value = false;
                    nextTick(() => contentEl.value?.focus());
                }

                function onKeydown(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') submitFeedback();
                }

                onMounted(async () => {
                    document.addEventListener('keydown', onKeydown);

                    source.value = getSourceFromUrl();
                    if (source.value) console.log('反馈来源：', source.value);

                    try {
                        await GitHub.init();
                        ready.value = true;
                        setStatus('ok', '已连接');
                    } catch (e) {
                        console.error(e);
                        setStatus('err', 'Token 解密失败');
                        toast('Token 解密失败，暂时无法提交反馈', 'error');
                        tokenFailed.value = true;
                        return;
                    }

                    setTimeout(() => contentEl.value?.focus(), 200);
                });

                onBeforeUnmount(() => {
                    document.removeEventListener('keydown', onKeydown);
                });

                return {
                    TYPES,
                    TOAST_BG,
                    type,
                    content,
                    contact,
                    source,
                    done,
                    submitting,
                    contentEl,
                    toasts,
                    statusDotClass,
                    statusText,
                    submitDisabled,
                    submitFeedback,
                    showForm
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
