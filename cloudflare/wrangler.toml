name = "tools-api"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[vars]
# 允许跨域的前端来源（GitHub Pages 站点）
ALLOW_ORIGIN = "https://ulnae.github.io"

# D1 数据库绑定：database_id 在执行
#   wrangler d1 create tools-data
# 后替换为命令输出的真实 id
[[d1_databases]]
binding = "DB"
database_name = "tools-data"
database_id = "7c32e926-07a4-43b7-a2cb-c8317197bcaf"
