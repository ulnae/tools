<script>
/* =====================================================================
   常量
===================================================================== */
const TYPES = [
  { id: 'text',  label: '文本' },
  { id: 'url',   label: '网址' },
  { id: 'vcard', label: '名片' },
  { id: 'wifi',  label: 'WiFi' },
  { id: 'sms',   label: '短信' },
  { id: 'tel',   label: '电话' },
  { id: 'email', label: '邮件' },
];

const TYPE_LABEL = TYPES.reduce((m, t) => { m[t.id] = t.label; return m; }, {});

/* 二维码容量上限（字节，UTF-8） */
const MAX_BYTES = { L: 2953, M: 2331, Q: 1663, H: 1273 };

/* 各类型默认表单数据 */
const DEFAULT_DATA = {
  text:  { text: '' },
  url:   { url: '' },
  vcard: { lastName: '', firstName: '', phone: '', email: '', company: '', title: '' },
  wifi:  { ssid: '', password: '', encryption: 'WPA', hidden: false },
  sms:   { phone: '', message: '' },
  tel:   { phone: '' },
  email: { address: '', subject: '', body: '' },
};

/* =====================================================================
   接管 qrcode-generator 的字节编码：改为标准 UTF-8（含 emoji）
===================================================================== */
if (typeof qrcode === 'function') {
  qrcode.stringToBytes = function (str) {
    const bytes = [];
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i);
      if (code < 0x80) {
        bytes.push(code);
      } else if (code < 0x800) {
        bytes.push(0xC0 | (code >> 6), 0x80 | (code & 0x3F));
      } else if (code >= 0xD800 && code <= 0xDBFF && i + 1 < str.length) {
        const next = str.charCodeAt(++i);
        const cp = 0x10000 + ((code - 0xD800) << 10) + (next - 0xDC00);
        bytes.push(
          0xF0 | (cp >> 18),
          0x80 | ((cp >> 12) & 0x3F),
          0x80 | ((cp >> 6) & 0x3F),
          0x80 | (cp & 0x3F)
        );
      } else {
        bytes.push(
          0xE0 | (code >> 12),
          0x80 | ((code >> 6) & 0x3F),
          0x80 | (code & 0x3F)
        );
      }
    }
    return bytes;
  };
}

/* =====================================================================
   工具函数
===================================================================== */
const escapeHtml = (s) => {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
};

const encodeParam = (v) => encodeURIComponent(v || '');

/** 精确计算 UTF-8 字节长度 */
function utf8Length(str) {
  if (typeof TextEncoder !== 'undefined') {
    try { return new TextEncoder().encode(str).length; } catch (e) { /* fallback */ }
  }
  let len = 0;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    if (c < 0x80) len += 1;
    else if (c < 0x800) len += 2;
    else if (c >= 0xd800 && c <= 0xdbff && i + 1 < str.length) { len += 4; i++; }
    else len += 3;
  }
  return len;
}

/* =====================================================================
   Vue 应用
===================================================================== */
const { createApp, ref, reactive, computed, watch, onMounted } = Vue;

createApp({
  setup() {
    /* ---------- 状态 ---------- */
    const currentType = ref('text');
    const formData = reactive(JSON.parse(JSON.stringify(DEFAULT_DATA)));

    const qrHint = ref('实时预览');
    const qrData = ref('');

    /* ---------- DOM 引用 ---------- */
    const qrContainerRef = ref(null);

    /* ---------- 派生数据：把当前类型表单拼成二维码内容 ---------- */
    const builtData = computed(() => {
      const t = currentType.value;
      const d = formData[t];

      switch (t) {
        case 'text':
          return d.text || '';

        case 'url':
          return d.url || '';

        case 'vcard': {
          const lines = ['BEGIN:VCARD', 'VERSION:3.0'];
          const lastName = d.lastName || '';
          const firstName = d.firstName || '';
          lines.push(`N:${lastName};${firstName};;;`);
          const fullName = [lastName, firstName].filter(Boolean).join(' ');
          if (fullName) lines.push(`FN:${fullName}`);
          if (d.company) lines.push(`ORG:${d.company}`);
          if (d.title) lines.push(`TITLE:${d.title}`);
          if (d.phone) lines.push(`TEL;TYPE=CELL:${d.phone}`);
          if (d.email) lines.push(`EMAIL;TYPE=INTERNET:${d.email}`);
          lines.push('END:VCARD');
          return lines.join('\n');
        }

        case 'wifi': {
          const ssid = d.ssid || '';
          const enc = d.encryption || 'WPA';
          const pwd = d.password || '';
          const hidden = d.hidden ? 'H:true;' : 'H:false;';
          const escapeWifi = (s) => s.replace(/([\\;,":])/g, '\\$1');
          return `WIFI:S:${escapeWifi(ssid)};T:${enc};P:${escapeWifi(pwd)};${hidden};`;
        }

        case 'sms': {
          const phone = d.phone || '';
          const msg = d.message || '';
          return msg ? `SMSTO:${phone}:${msg}` : `SMSTO:${phone}`;
        }

        case 'tel':
          return `tel:${d.phone || ''}`;

        case 'email': {
          const addr = d.address || '';
          if (!addr) return '';
          let result = `mailto:${addr}`;
          const params = [];
          if (d.subject) params.push(`subject=${encodeParam(d.subject)}`);
          if (d.body) params.push(`body=${encodeParam(d.body)}`);
          if (params.length) result += '?' + params.join('&');
          return result;
        }

        default:
          return '';
      }
    });

    /* ---------- 渲染二维码到 canvas ---------- */
    function renderQRToCanvas(text, level) {
      const qr = qrcode(0, level);
      qr.addData(text);
      qr.make();

      const count = qr.getModuleCount();
      const margin = 4;
      const cellSize = Math.max(2, Math.floor(260 / (count + margin * 2)));
      const size = (count + margin * 2) * cellSize;

      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;

      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);

      ctx.fillStyle = '#1c1c1e';
      for (let r = 0; r < count; r++) {
        for (let c = 0; c < count; c++) {
          if (qr.isDark(r, c)) {
            ctx.fillRect(
              (c + margin) * cellSize,
              (r + margin) * cellSize,
              cellSize,
              cellSize
            );
          }
        }
      }
      return canvas;
    }

    /* ---------- 清空容器（唯一入口，保证 DOM 与内部状态一致） ---------- */
    function clearContainer() {
      const box = qrContainerRef.value;
      if (box) box.innerHTML = '';
      return box;
    }

    /* ---------- 显示错误 ---------- */
    function renderError(title, detail) {
      const box = clearContainer();
      if (!box) return;
      box.innerHTML =
        '<p class="qr-error">' + escapeHtml(title) +
        (detail ? '<small>' + escapeHtml(detail) + '</small>' : '') +
        '</p>';
    }

    /* ---------- 更新二维码 ---------- */
    function updateQRCode() {
      const box = clearContainer();
      if (!box) return;

      const data = builtData.value;
      qrData.value = data;

      if (!data) {
        box.innerHTML = '<p class="text-faint text-sm">输入内容后自动生成</p>';
        qrHint.value = '实时预览';
        return;
      }

      if (typeof qrcode !== 'function') {
        renderError('二维码组件加载失败', '请检查网络后刷新页面重试');
        qrHint.value = '组件未加载';
        return;
      }

      const bytes = utf8Length(data);
      const charCount = data.length;

      const levels = ['M', 'L'];
      let canvas = null;
      let usedLevel = '';
      let lastError = null;

      for (let i = 0; i < levels.length; i++) {
        try {
          canvas = renderQRToCanvas(data, levels[i]);
          usedLevel = levels[i];
          break;
        } catch (err) {
          lastError = err;
          canvas = null;
        }
      }

      if (!canvas) {
        console.warn('[QRCode] 生成失败：', lastError);
        if (bytes > MAX_BYTES.L) {
          renderError(
            '内容过长，无法生成二维码',
            `当前 ${bytes} 字节，单个二维码最多约 ${MAX_BYTES.L} 字节`
          );
          qrHint.value = `类型：${TYPE_LABEL[currentType.value]} · ${bytes} 字节 · 超出容量`;
        } else {
          renderError('二维码生成失败', '请尝试精简内容或删除特殊字符');
          qrHint.value = `类型：${TYPE_LABEL[currentType.value]} · ${bytes} 字节 · 生成失败`;
        }
        return;
      }

      box.appendChild(canvas);
      qrHint.value =
        `类型：${TYPE_LABEL[currentType.value]} · ${charCount} 字符 / ${bytes} 字节` +
        (usedLevel === 'L' ? ' · 已降低纠错级别' : '');
    }

    /* ---------- 类型切换 ---------- */
    function switchType(id) {
      if (id === currentType.value) return;
      currentType.value = id;
    }

    /* ---------- 重置 ---------- */
    function resetForm() {
      Object.assign(formData[currentType.value],
        JSON.parse(JSON.stringify(DEFAULT_DATA[currentType.value])));
    }

    /* ---------- 下载 ---------- */
    function downloadQR() {
      const box = qrContainerRef.value;
      const canvas = box && box.querySelector('canvas');
      if (!canvas) {
        alert('请先输入内容生成二维码');
        return;
      }
      const link = document.createElement('a');
      link.download = `qrcode-${currentType.value}-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    /* ---------- 防抖更新 ---------- */
    let debounceTimer = null;
    function scheduleUpdate() {
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(updateQRCode, 180);
    }

    /* ---------- 监听：数据或类型变化时更新 ---------- */
    watch(builtData, () => scheduleUpdate());
    watch(currentType, () => scheduleUpdate());

    /* 挂载后渲染一次（此时模板 ref 已就绪） */
    onMounted(() => updateQRCode());

    /* ---------- 暴露 ---------- */
    return {
      TYPES,
      currentType,
      formData,
      qrHint,
      qrData,
      qrContainerRef,
      switchType,
      resetForm,
      downloadQR,
    };
  }
}).mount('#app');
</script>
</body>
</html>
