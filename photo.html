  /* 卡片内部比例（相对卡片宽度） */
  const IN = {
    pad: 0.075,       // 内边距
    gap: 0.055,       // 图片与文字间距
    radius: 0.100,    // 卡片圆角
    imgRadius: 0.070, // 图片圆角
    fontSize: 0.078,  // 文案字号
    lineH: 0.112,     // 文案行高
    maxLines: 2       // 文案最多行数

  /* ★ 图片固定宽高比：9 : 16（宽 / 高） */
  const IMG_ASPECT = 9 / 16;

  /* ★ 缩放极限（近似“无限放大 / 无限缩小”） */
  const MIN_SCALE = 0.0015;
  const MAX_SCALE = 400;

  const WORLD_SCALE = 500;    // 心形单位 → 世界坐标

  /* =========================================================
   *  3. 心形参数曲线（归一化：宽 2，高约 1.81）
   * ========================================================= */
  const HEART = (function () {
    const pts = [];
    const N = 900;
    for (let i = 0; i < N; i++) {
      const t = (i / N) * Math.PI * 2;
      const s = Math.sin(t);
      const x = 16 * s * s * s;
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t)
              - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      pts.push([x / 16, y / 16]);
    }
    return pts;
  })();

  let HY_MAX = -Infinity, HY_MIN = Infinity;
  for (let i = 0; i < HEART.length; i++) {
    const y = HEART[i][1];
    if (y > HY_MAX) HY_MAX = y;
    if (y < HY_MIN) HY_MIN = y;
  }

  /** 返回高度 y 处心形内部的水平区间 [[x1,x2], ...] */
  function heartIntervals(y) {
    const P = HEART, L = P.length;
    const xs = [];
    for (let i = 0; i < L; i++) {
      const p1 = P[i], p2 = P[(i + 1) % L];
      const y1 = p1[1], y2 = p2[1];
      if ((y1 <= y && y2 > y) || (y2 <= y && y1 > y)) {
        const k = (y - y1) / (y2 - y1);
        xs.push(p1[0] + k * (p2[0] - p1[0]));
      }
    }
    xs.sort(function (a, b) { return a - b; });
    const out = [];
    for (let i = 0; i + 1 < xs.length; i += 2) out.push([xs[i], xs[i + 1]]);
    return out;
  }

  /* =========================================================
   *  4. 卡片几何（9:16 图片 + 文案区）
   * ========================================================= */
  /** 给定卡片宽度，算出卡片总高度 */
  function cardHeight(cw) {
    const pad = cw * IN.pad;
    const imgW = cw - pad * 2;
    const imgH = imgW / IMG_ASPECT;
    const gap = cw * IN.gap;
    const textH = cw * IN.lineH * IN.maxLines;
    return pad * 2 + imgH + gap + textH;
  }

  /** 间距随卡片大小动态变化 */
  function gapFor(w) {
    return 0.020 + 0.160 * w;
  }

  /* =========================================================
   *  5. 按行扫描心形，生成卡片中心点
   * ========================================================= */
  function scanLayout(w, gx, gy) {
    const h = cardHeight(w);
    const out = [];
    const step = h + gy;
    if (step <= 0) return out;

    const yStart = HY_MAX - h / 2;
    const yEnd = HY_MIN + h / 2;

    for (let y = yStart; y >= yEnd - 1e-9; y -= step) {
      const spans = heartIntervals(y);
      for (let s = 0; s < spans.length; s++) {
        const a = spans[s][0] + w / 2;
        const b = spans[s][1] - w / 2;
        if (b <= a) continue;

        const n = Math.floor((b - a + gx) / (w + gx));
        if (n <= 0) continue;

        const total = n * w + (n - 1) * gx;
        const start = (a + b) / 2 - total / 2;

        for (let i = 0; i < n; i++) {
          out.push({
            x: start + i * (w + gx) + w / 2,
            y: y
          });
        }
      }
    }
    return out;
  }

  /* =========================================================
   *  6. 求解卡片尺寸：图片少 → 大；图片多 → 小
   *     竖版卡片较高，宽度上限相应收紧，保证心形轮廓清晰
   * ========================================================= */
  const CARD_W_MAX = 0.38;   // ★ 竖版卡片宽度上限（相对心形宽 2）

  function solveLayout(n) {
    const countAt = function (w) {
      const g = gapFor(w);
      return scanLayout(w, g, g).length;
    };

    let lo = 0.014, hi = 1.0;

    let guard = 0;
    while (countAt(lo) < n && lo > 0.003 && guard++ < 30) lo *= 0.75;
    if (countAt(lo) < n) lo = 0.003;

    // 二分：能放下 n 个的最大卡片宽度
    for (let i = 0; i < 42; i++) {
      const mid = (lo + hi) / 2;
      if (countAt(mid) >= n) lo = mid;
      else hi = mid;
    }

    let w = Math.min(lo, CARD_W_MAX);
    let g = gapFor(w);
    let pos = scanLayout(w, g, g);

    let safe = 0;
    while (pos.length < n && w > 0.006 && safe++ < 40) {
      w *= 0.88;
      g = gapFor(w);
      pos = scanLayout(w, g, g);
    }

    return { w: w, positions: pos };
  }

  /* =========================================================
   *  7. 画布 / 视图状态
   * ========================================================= */
  const canvas = document.getElementById('cv');

  /* =========================================================
   *  8. 工具
   * ========================================================= */
  function roundRect(g, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  /** contain：图片完整显示，不裁切，居中留白 */
  function drawContain(g, img, x, y, w, h) {
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    if (!iw || !ih || w <= 0 || h <= 0) return;

    const s = Math.min(w / iw, h / ih);
    const dw = iw * s;
    const dh = ih * s;
    const dx = x + (w - dw) / 2;
    const dy = y + (h - dh) / 2;

    g.drawImage(img, dx, dy, dw, dh);
  }

  /* ------- 文字换行（带缓存） ------- */
  const measureCanvas = document.createElement('canvas');
  const measureCtx = measureCanvas.getContext('2d');
  const textCache = new Map();

  function wrapText(text, maxWidth, fs) {
    const key = fs.toFixed(3) + '|' + Math.round(maxWidth) + '|' + text;
    const hit = textCache.get(key);
    if (hit) return hit;

    measureCtx.font = fs + 'px ' + FONT_FAMILY;
    const chars = Array.from(text);
    const lines = [];
    let cur = '';

    for (let i = 0; i < chars.length; i++) {
      const ch = chars[i];
      if (cur === '') { cur = ch; continue; }

      if (measureCtx.measureText(cur + ch).width <= maxWidth) {
        cur += ch;
      } else {
        lines.push(cur);
        cur = ch;
        if (lines.length === IN.maxLines - 1) {
          let rest = chars.slice(i).join('');
          if (measureCtx.measureText(rest).width > maxWidth) {
            while (rest.length > 1 &&
                   measureCtx.measureText(rest + '…').width > maxWidth) {
              rest = rest.slice(0, -1);
            }
            rest += '…';
          }
          lines.push(rest);
          textCache.set(key, lines);
          return lines;
        }
      }
    }
    if (cur) lines.push(cur);
    textCache.set(key, lines);
    return lines;
  }

  /* ------- 图片缓存 ------- */
  const imgCache = new Map();

  function getImage(url) {
    let rec = imgCache.get(url);
    if (rec) return rec;

    rec = { loaded: false, img: null };
    imgCache.set(url, rec);

    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = function () {
      rec.loaded = true;
      rec.img = im;
      requestRender();
    };
    im.onerror = function () { rec.loaded = false; };
    im.src = url;
    return rec;
  }

  /* =========================================================
   *  9. 绘制单张卡片
   * ========================================================= */
  function drawCard(c) {
    const cw = CARD_W;
    const ch = CARD_H;
    const px = cw * view.scale;

    const left = c.x - cw * 0.5;
    const top  = c.y - ch * 0.5;

    const pad = cw * IN.pad;
    const imgW = cw - pad * 2;
    const imgH = imgW / IMG_ASPECT;
    const gap = cw * IN.gap;
    const rad = cw * IN.radius;
    const imgRad = cw * IN.imgRadius;

    /* ---- 卡片底 + 阴影 ---- */
    ctx.save();
    if (px > 9) {
      ctx.shadowColor = STYLE.shadowColor;
      ctx.shadowBlur = cw * 0.13;
      ctx.shadowOffsetY = cw * 0.055;
    }
    ctx.fillStyle = STYLE.cardBg;
    roundRect(ctx, left, top, cw, ch, rad);
    ctx.fill();
    ctx.restore();

    /* ---- 图片（9:16 完整显示） ---- */
    const ix = left + pad;
    const iy = top + pad;

    ctx.save();
    roundRect(ctx, ix, iy, imgW, imgH, imgRad);
    ctx.clip();

    const rec = getImage(c.data.url);
    if (rec.loaded && rec.img) {
      // 底色（留白区域与卡片一致，视觉更干净）
      ctx.fillStyle = STYLE.cardBg;
      ctx.fillRect(ix, iy, imgW, imgH);
      drawContain(ctx, rec.img, ix, iy, imgW, imgH);
    } else {
      ctx.fillStyle = STYLE.imgPlaceholder;
      ctx.fillRect(ix, iy, imgW, imgH);
      ctx.fillStyle = STYLE.imgPlaceholderInk;
      const cx0 = ix + imgW / 2;
      const cy0 = iy + imgH / 2;
      ctx.beginPath();
      ctx.arc(cx0, cy0 - imgH * 0.12, imgW * 0.22, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx0 - imgW * 0.32, cy0 + imgH * 0.22);
      ctx.quadraticCurveTo(cx0, cy0 - imgH * 0.10, cx0 + imgW * 0.32, cy0 + imgH * 0.22);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    /* ---- 文案（缩得太小就不画，省性能） ---- */
    if (px < 18) return;

    const fs = cw * IN.fontSize;
    const lineH = cw * IN.lineH;
    const textTop = iy + imgH + gap;
    const textAreaH = lineH * IN.maxLines;

    ctx.save();
    ctx.font = fs + 'px ' + FONT_FAMILY;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = STYLE.textColor;

    const full = '\u201C' + c.data.text + '\u201D';
    const lines = wrapText(full, imgW * 0.96, fs);
    const totalH = lines.length * lineH;
    const startY = textTop + (textAreaH - totalH) / 2 + lineH / 2;

    for (let i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], c.x, startY + i * lineH);
    }
    ctx.restore();
  }

  /* =========================================================
   * 10. 渲染
   * ========================================================= */
  let rafPending = false;

  function requestRender() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
      render();
    });
  }

  function render() {
    const W = canvas.clientWidth;
    const H = canvas.clientHeight;
    if (!W || !H) return;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    // 暖白背景
    const g = ctx.createRadialGradient(
      W / 2, H * 0.44, 0,
      W / 2, H * 0.44, Math.max(W, H) * 0.86
    );
    g.addColorStop(0, STYLE.bgInner);
    g.addColorStop(1, STYLE.bgOuter);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(W / 2 + view.x, H / 2 + view.y);
    ctx.scale(view.scale, view.scale);

    const camX = -view.x / view.scale;
    const camY = -view.y / view.scale;
    const limitX = W / 2 / view.scale + CARD_W;
    const limitY = H / 2 / view.scale + CARD_H;

    for (let i = 0; i < cards.length; i++) {
      const c = cards[i];
      if (Math.abs(c.x - camX) > limitX) continue;
      if (Math.abs(c.y - camY) > limitY) continue;
      drawCard(c);
    }

    ctx.restore();
  }

  /* =========================================================
   * 11. 视图适配
   * ========================================================= */
  function fitView() {
    const W = canvas.clientWidth || 1;
    const H = canvas.clientHeight || 1;
    const padRatio = 0.06;
    const availW = W * (1 - padRatio * 2);
    const availH = H * (1 - padRatio * 2);

    let s = Math.min(availW / worldBounds.w, availH / worldBounds.h);
    s = Math.max(MIN_SCALE, Math.min(s, MAX_SCALE));

    view.scale = s;
    view.x = 0;
    view.y = 0;
  }

  function resize() {
    dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth;
    const H = canvas.clientHeight;
    canvas.width = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    requestRender();
  }

  /* =========================================================
   * 12. 交互
   * ========================================================= */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left - rect.width / 2;
    const my = e.clientY - rect.top - rect.height / 2;

    const factor = Math.exp(-e.deltaY * 0.0016);
    const ns = clamp(view.scale * factor, MIN_SCALE, MAX_SCALE);
    const k = ns / view.scale;

    view.x = mx - (mx - view.x) * k;
    view.y = my - (my - view.y) * k;
    view.scale = ns;
    requestRender();
  }, { passive: false });

  const pointers = new Map();
  let pinch = null;

  function pinchInfo() {
    const arr = Array.from(pointers.values());
    if (arr.length < 2) return null;
    const dx = arr[0].x - arr[1].x;
    const dy = arr[0].y - arr[1].y;
    return {
      dist: Math.sqrt(dx * dx + dy * dy),
      cx: (arr[0].x + arr[1].x) / 2,
      cy: (arr[0].y + arr[1].y) / 2
    };
  }

  canvas.addEventListener('pointerdown', function (e) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) pinch = pinchInfo();
    canvas.classList.add('dragging');
  });

  canvas.addEventListener('pointermove', function (e) {
    const p = pointers.get(e.pointerId);
    if (!p) return;

    const nx = e.clientX, ny = e.clientY;

    if (pointers.size === 1) {
      view.x += nx - p.x;
      view.y += ny - p.y;
      p.x = nx; p.y = ny;
      requestRender();
      return;
    }

    if (pointers.size === 2) {
      p.x = nx; p.y = ny;
      const cur = pinchInfo();
      if (pinch && cur && pinch.dist > 0) {
        const rect = canvas.getBoundingClientRect();
        const mx = cur.cx - rect.left - rect.width / 2;
        const my = cur.cy - rect.top - rect.height / 2;

        const ns = clamp(view.scale * (cur.dist / pinch.dist), MIN_SCALE, MAX_SCALE);
        const k = ns / view.scale;
        view.x = mx - (mx - view.x) * k;
        view.y = my - (my - view.y) * k;
        view.scale = ns;
      }
      pinch = cur;
      requestRender();
    }
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 0) canvas.classList.remove('dragging');
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  }

  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', function (e) {
    if (pointers.has(e.pointerId)) endPointer(e);
  });

  /* =========================================================
   * 13. 初始化
   * ========================================================= */
  function build() {
    const N = Math.max(1, PHOTOS.length);

    const solved = solveLayout(N);
    let pos = solved.positions;

    CARD_W = solved.w * WORLD_SCALE;
    CARD_H = cardHeight(CARD_W);

    if (pos.length === 0) {
      pos = [{ x: 0, y: 0 }];
    }

    // 位置比照片多 → 均匀抽稀，保持心形轮廓均匀
    if (pos.length > N) {
      const picked = [];
      for (let i = 0; i < N; i++) {
        picked.push(pos[Math.floor((i + 0.5) * pos.length / N)]);
      }
      pos = picked;
    }

    // 生成卡片（心形 y 轴向上 → 世界坐标 y 轴向下）
    cards = pos.map(function (p, i) {
      return {
        x: p.x * WORLD_SCALE,
        y: -p.y * WORLD_SCALE,
        data: PHOTOS[i % PHOTOS.length]
      };
    });

    // 包围盒并居中
    const hw = CARD_W / 2, hh = CARD_H / 2;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (let i = 0; i < cards.length; i++) {
      const c = cards[i];
      if (c.x - hw < minX) minX = c.x - hw;
      if (c.x + hw > maxX) maxX = c.x + hw;
      if (c.y - hh < minY) minY = c.y - hh;
      if (c.y + hh > maxY) maxY = c.y + hh;
    }

    const cx = (minX + maxX) / 2;
    const cy = (minY + maxY) / 2;
    for (let i = 0; i < cards.length; i++) {
      cards[i].x -= cx;
      cards[i].y -= cy;
    }

    worldBounds = {
      w: Math.max(1, maxX - minX),
      h: Math.max(1, maxY - minY)
    };

    // 预加载图片
    for (let i = 0; i < cards.length; i++) {
      getImage(cards[i].data.url);
    }
  }

  function init() {
    dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(canvas.clientWidth * dpr));
    canvas.height = Math.max(1, Math.round(canvas.clientHeight * dpr));

    build();
    fitView();
    requestRender();

    window.addEventListener('resize', function () {
      resize();
    });

    // 异步加载卡通字体
    try {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap';
      document.head.appendChild(link);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          textCache.clear();
          requestRender();
        });
      }
    } catch (e) { /* 忽略 */ }
  }

  init();
})();
</script>
</body>
